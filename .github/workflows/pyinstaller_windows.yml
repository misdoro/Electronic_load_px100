name: PyInstaller Windows

on: push

jobs:
  build:
    name: Build windows installer
    runs-on: windows-latest
    strategy:
      matrix:
        python_arch: [ x64 ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        architecture: ${{ matrix.python_arch }}
    - name: Install NSIS
      run: |
        choco install nsis --no-progress -y
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    - name: build with pyinstaller
      run: |
        pyinstaller px100.spec
    - name: Build NSIS installer package
      run: |
        $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
        & $makensis -VERSION
        & $makensis "/XOutFile Battery-Tester-PX100-${{matrix.python_arch}}.exe" "px100.nsi"
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer${{matrix.python_arch}}
        path: Battery-Tester*
  release:
    name: Prepare a release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
      - name: List files
        run: |
          ls -l
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload x64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Battery-Tester-PX100-x64.exe
          asset_name: Battery-Tester-PX100-x64.exe
          asset_content_type: application/exe
