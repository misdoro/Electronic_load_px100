name: Build installers

on: push

jobs:
  build-windows:
    name: Build windows installer
    runs-on: windows-latest
    strategy:
      matrix:
        python_arch: [ x64 ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        architecture: ${{ matrix.python_arch }}
    - name: Install NSIS
      run: |
        choco install nsis --no-progress -y
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    - name: build with pyinstaller
      run: |
        pyinstaller px100.spec
    - name: Build NSIS installer package
      run: |
        $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
        & $makensis -VERSION
        & $makensis "/XOutFile Battery-Tester-PX100-${{matrix.python_arch}}.exe" "px100.nsi"
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer-windows-${{matrix.python_arch}}
        path: Battery-Tester*

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build app bundle
        run: |
          pyinstaller --noconfirm --windowed --name "Battery Tester PX100" --hidden-import pyvisa_py --hidden-import serial main.py
      - name: Build DMG
        run: |
          APP_NAME="Battery Tester PX100"
          DMG_NAME="Battery-Tester-PX100-macos.dmg"
          mkdir -p dist/dmg
          cp -R "dist/${APP_NAME}.app" dist/dmg/
          hdiutil create -volname "${APP_NAME}" -srcfolder dist/dmg -ov -format UDZO "dist/${DMG_NAME}"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: dist/Battery-Tester-PX100-macos.dmg

  release:
    name: Prepare a release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List files
        run: |
          ls -l artifacts
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload x64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/Battery-Tester-PX100-x64.exe
          asset_name: Battery-Tester-PX100-x64.exe
          asset_content_type: application/exe
      - name: Upload macOS DMG
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/Battery-Tester-PX100-macos.dmg
          asset_name: Battery-Tester-PX100-macos.dmg
          asset_content_type: application/x-apple-diskimage
